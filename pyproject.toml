[project]
name = "pyavro"
dynamic = ["version"]
authors = [{ name="Babartzy László", emails=["csatacsibe@gmail.com", "LaszloRajmund.Babartzy@erstebank.hu"] }]
description = "This project aims to implement all avro functionalities to python"
readme = "README.md"
license = "Apache-2.0"
requires-python = "~=3.12"

dependencies = [
    "antlr4-python3-runtime~=4.13.2",
    "click~=8.1.8"
]
[project.scripts]
pyavro-tools = "pyavro.pyavrotools:avro_tools"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pyavro/__init__.py"

[tool.hatch.build]
ignore-vcs = true
include = ["pyavro/**"]

[tool.hatch.build.target.wheel]
packages = ["pyavro"]